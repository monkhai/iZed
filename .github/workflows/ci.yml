name: iPad compile check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "example"
      - name: Prepare pinned Zed source
        run: ./scripts/prepare-zed.sh --patch-only
      - name: Check iPad app
        working-directory: example
        run: cargo check --target aarch64-apple-ios --features editor-spike --lib
