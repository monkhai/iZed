[workspace]

[package]
name = "ized-terminal-web-preview"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { path = "../../zed/crates/gpui" }
gpui_platform = { path = "../../zed/crates/gpui_platform" }
serde_json = "1"
wasm-bindgen = "0.2"
unicode-segmentation = "1"
web-sys = { version = "0.3", features = ["Window", "Location", "History"] }

[profile.dev]
debug = 0
