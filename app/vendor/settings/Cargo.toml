[package]
name = "settings"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"


[lib]
path = "src/settings.rs"
doctest = false

[features]
test-support = ["gpui/test-support", "fs/test-support"]

[dependencies]
anyhow = { version = "1.0.86" }
collections = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "collections" }
ec4rs = { version = "1.1" }
fs = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "fs" }
futures = { version = "0.3.32" }
gpui = { default-features = false, git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "gpui" }
inventory = { version = "0.3.19" }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
migrator = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "migrator" }
paths = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "paths" }
release_channel = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "release_channel" }
rust-embed = { version = "8.11", features = ["include-exclude"] }
schemars = { version = "1.0", features = ["indexmap2"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
serde_json_lenient = { version = "0.2", features = ["preserve_order", "raw_value"] }
settings_content = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "settings_content" }
settings_json = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "settings_json" }
settings_macros = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "settings_macros" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
util = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "util" }
zlog = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "zlog" }

[dev-dependencies]
fs = { git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "fs", features = ["test-support"] }
gpui = { default-features = false, git = "https://github.com/zed-industries/zed", rev = "5688167d224b5eca54875d49afb8bfd73a07915a", package = "gpui", features = ["test-support"] }

indoc = { version = "2" }
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
unindent = { version = "0.2.0" }
